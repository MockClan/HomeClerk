# Xcode project for HomeClerk.app, which runs everything through the HomeClerkKit package.
# HomeClerk.xcodeproj is generated from this file; after adding or renaming Swift files, run:
#   xcodegen
# (./build.sh does it for you.)

name: HomeClerk
options:
  bundleIdPrefix: com.mockclan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Marks the project as checked against Xcode 27's recommended settings (adopted below), so
  # Xcode doesn't offer to "Update to recommended settings" every time it opens
  xcodeVersion: "27.0"

packages:
  HomeClerkKit:
    path: HomeClerkKit

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"       # "Sign to Run Locally" — no Apple developer account needed
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode 27's recommended settings, as a new project gets them
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17

targets:
  HomeClerk:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist]
      # The layered icon (light, dark, clear, and tinted); Xcode also makes the flat icon for
      # macOS 14 and 15 from it
      - path: icon/HomeClerk.icon
        buildPhase: resources
      # Document types, areas, tags, and folder rules, read from the app's Resources
      - path: Resources/taxonomy.json
        buildPhase: resources
      # MockClan's crest in About HomeClerk, rendered from Resources/mockclan.svg:
      #   rsvg-convert -h 44 mockclan.svg -o mockclan.png; rsvg-convert -h 88 mockclan.svg -o mockclan@2x.png
      - path: Resources/mockclan.png
        buildPhase: resources
      - path: Resources/mockclan@2x.png
        buildPhase: resources
    dependencies:
      - package: HomeClerkKit
    settings:
      base:
        PRODUCT_NAME: HomeClerk
        PRODUCT_BUNDLE_IDENTIFIER: com.mockclan.homeclerk
        # Swift 6: data races are compile errors, as in HomeClerkKit
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: HomeClerk

schemes:
  HomeClerk:
    build:
      targets:
        HomeClerk: all
    run:
      config: Debug
      environmentVariables:
        # Turn on (Product ▸ Scheme ▸ Edit Scheme ▸ Run ▸ Arguments) to use a scratch folder
        # instead of your real ~/HomeClerk — its Inbox, Organized, and so on are created there.
        - variable: HOMECLERK_HomeClerk__BasePath
          value: $(HOME)/HomeClerk-TestData/xcode-scratch
          isEnabled: false
    # Product ▸ Test (⌘U) runs HomeClerkKit's tests — the same ones as `swift test` in HomeClerkKit/
    test:
      config: Debug
      targets:
        - package: HomeClerkKit/HomeClerkKitTests
